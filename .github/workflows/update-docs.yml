name: Update Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update-docs:
    name: Generate & Push Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation
        run: npm run docs:generate

      - name: Check for generated docs
        id: check_docs
        run: |
          if [ -d "docs" ] && [ "$(ls -A docs)" ]; then
            echo "has_docs=true" >> $GITHUB_OUTPUT
            echo "Documentation generated successfully"
          else
            echo "has_docs=false" >> $GITHUB_OUTPUT
            echo "No documentation was generated"
          fi

      - name: Clone docs repo
        if: steps.check_docs.outputs.has_docs == 'true'
        run: |
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/soheimam/agent_doc.git docs-repo

      - name: Copy docs to docs repo
        if: steps.check_docs.outputs.has_docs == 'true'
        run: |
          # Clear existing generated docs (preserve README and .git)
          find docs-repo/docs -type f -not -name '.gitkeep' -delete 2>/dev/null || true
          mkdir -p docs-repo/docs

          # Copy newly generated docs
          cp -r docs/* docs-repo/docs/

      - name: Check for changes
        if: steps.check_docs.outputs.has_docs == 'true'
        id: check_changes
        working-directory: docs-repo
        run: |
          # Stage everything so we can detect untracked files too (first run will have all new files)
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No documentation changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected:"
            git diff --cached --stat
          fi

      - name: Create branch and open PR
        if: steps.check_docs.outputs.has_docs == 'true' && steps.check_changes.outputs.has_changes == 'true'
        working-directory: docs-repo
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a timestamped branch
          BRANCH_NAME="docs-update-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          # Stage and commit
          git add docs/
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          git commit -m "docs: update API documentation from ${SHORT_SHA}

          Auto-generated from soheimam/agent_api@${COMMIT_SHA}
          Triggered by push to main branch."

          # Push the branch
          git push origin "$BRANCH_NAME"

          # Create a pull request
          gh pr create \
            --repo soheimam/agent_doc \
            --title "docs: update API documentation (${SHORT_SHA})" \
            --body "## Automated Documentation Update

          This PR was automatically generated by the [update-docs workflow](https://github.com/soheimam/agent_api/actions) in the API repository.

          **Source commit:** soheimam/agent_api@${COMMIT_SHA}
          **Generated at:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ### Changes
          Updated TypeDoc-generated API documentation to reflect the latest source code changes.

          ---
          *This PR was created automatically. Please review the documentation changes before merging.*" \
            --base main \
            --head "$BRANCH_NAME"
